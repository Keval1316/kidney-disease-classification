[project]
name = "kidney-disease-classification"
version = "0.1.0"
description = "Educational CT kidney disease classification (Normal/Cyst/Tumor/Stone) — DL + MLOps demo project. Not a medical device."
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"